name: Update activity overview

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-activity-chart.mjs"
      - ".github/workflows/activity-overview.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity chart
        run: node .github/scripts/generate-activity-chart.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated chart
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update activity overview"
          file_pattern: assets/activity-overview.svg
