<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Ldemon's Snake</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --panel: rgba(18, 27, 52, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5eefc;
      --muted: #91a4c6;
      --green: #59f3a7;
      --cyan: #55d8ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(85, 216, 255, 0.16), transparent 32rem),
        radial-gradient(circle at 90% 85%, rgba(89, 243, 167, 0.13), transparent 30rem),
        #080d1b;
    }

    .game {
      width: min(92vw, 620px);
      padding: clamp(16px, 4vw, 28px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
    }

    header, .stats, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 0.9rem; }

    .stats { justify-content: flex-end; }
    .stat {
      min-width: 72px;
      padding: 8px 12px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(6, 11, 26, 0.5);
    }
    .stat span { display: block; color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat strong { font-size: 1.25rem; }

    .board-wrap { position: relative; margin: 22px 0 16px; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #090f20;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      border-radius: 18px;
      background: rgba(5, 9, 20, 0.72);
      backdrop-filter: blur(5px);
    }
    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0 0 7px; font-size: 2rem; }
    .overlay p { margin: 0 0 18px; color: var(--muted); }

    button {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 17px;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: rgba(30, 43, 74, 0.9);
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      touch-action: manipulation;
    }
    button:hover { transform: translateY(-1px); border-color: rgba(89, 243, 167, 0.5); }
    button:active { transform: translateY(1px); }
    .primary { color: #06140e; border: 0; background: linear-gradient(135deg, var(--green), var(--cyan)); }

    .actions { color: var(--muted); font-size: 0.82rem; }
    .controls {
      display: none;
      width: 176px;
      margin: 18px auto 0;
      grid-template: repeat(2, 50px) / repeat(3, 50px);
      gap: 6px;
    }
    .controls button { padding: 0; font-size: 1.2rem; }
    .up { grid-column: 2; }
    .left { grid-row: 2; grid-column: 1; }
    .down { grid-row: 2; grid-column: 2; }
    .right { grid-row: 2; grid-column: 3; }

    @media (pointer: coarse), (max-width: 560px) {
      .controls { display: grid; }
      .actions .hint { display: none; }
      header { align-items: flex-start; }
      .stat { min-width: 62px; padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <h1>🐍 Ldemon's Snake</h1>
        <p class="subtitle">Eat, grow, and chase your high score.</p>
      </div>
      <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="message">Ready?</h2>
        <p id="detail">Use arrow keys or WASD to move.</p>
        <button class="primary" id="start">Play now</button>
      </div>
    </div>

    <div class="actions">
      <span class="hint">Arrow keys / WASD · Space to pause</span>
      <button id="pause">Pause</button>
      <button id="restart">Restart</button>
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="up" data-direction="up" aria-label="Move up">↑</button>
      <button class="left" data-direction="left" aria-label="Move left">←</button>
      <button class="down" data-direction="down" aria-label="Move down">↓</button>
      <button class="right" data-direction="right" aria-label="Move right">→</button>
    </div>
  </main>

  <script>
    const canvas = document.querySelector('#board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const bestEl = document.querySelector('#best');
    const overlay = document.querySelector('#overlay');
    const message = document.querySelector('#message');
    const detail = document.querySelector('#detail');
    const startButton = document.querySelector('#start');
    const pauseButton = document.querySelector('#pause');
    const restartButton = document.querySelector('#restart');

    const cells = 20;
    const size = canvas.width / cells;
    const directions = {
      up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
      left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
    };
    const keyMap = {
      ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
      ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right'
    };

    let snake, food, direction, nextDirection, score, timer, running = false, paused = false;
    let best = Number(localStorage.getItem('ldemon-snake-best') || 0);
    bestEl.textContent = best;

    function reset() {
      clearInterval(timer);
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      direction = directions.right;
      nextDirection = direction;
      score = 0;
      scoreEl.textContent = score;
      food = spawnFood();
      paused = false;
      pauseButton.textContent = 'Pause';
      draw();
    }

    function spawnFood() {
      let point;
      do {
        point = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
      } while (snake?.some(part => part.x === point.x && part.y === point.y));
      return point;
    }

    function start() {
      reset();
      running = true;
      overlay.hidden = true;
      timer = setInterval(tick, 110);
    }

    function tick() {
      if (paused) return;
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      const hitWall = head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        food = spawnFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.055)';
      ctx.lineWidth = 1;
      for (let i = 1; i < cells; i++) {
        ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(canvas.width, i * size); ctx.stroke();
      }

      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ff6685';
      ctx.fillStyle = '#ff6685';
      ctx.beginPath();
      ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * 0.3, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((part, index) => {
        const gradient = ctx.createLinearGradient(part.x * size, part.y * size, (part.x + 1) * size, (part.y + 1) * size);
        gradient.addColorStop(0, index === 0 ? '#55d8ff' : '#59f3a7');
        gradient.addColorStop(1, '#37c98a');
        ctx.shadowColor = index === 0 ? '#55d8ff' : '#59f3a7';
        ctx.fillStyle = gradient;
        roundRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4, 8);
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function gameOver() {
      running = false;
      clearInterval(timer);
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('ldemon-snake-best', best);
      }
      message.textContent = 'Game over';
      detail.textContent = `You scored ${score} points.`;
      startButton.textContent = 'Play again';
      overlay.hidden = false;
    }

    function setDirection(name) {
      const candidate = directions[name];
      if (!candidate || candidate.x === -direction.x && candidate.y === -direction.y) return;
      nextDirection = candidate;
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseButton.textContent = paused ? 'Resume' : 'Pause';
    }

    document.addEventListener('keydown', event => {
      if (keyMap[event.key]) {
        event.preventDefault();
        setDirection(keyMap[event.key]);
      } else if (event.code === 'Space') {
        event.preventDefault();
        togglePause();
      }
    });
    document.querySelectorAll('[data-direction]').forEach(button => {
      button.addEventListener('pointerdown', () => setDirection(button.dataset.direction));
    });
    startButton.addEventListener('click', start);
    restartButton.addEventListener('click', start);
    pauseButton.addEventListener('click', togglePause);

    reset();
  </script>
</body>
</html>
